<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday, Bailey!</title>

    <style>

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            background:
                radial-gradient(circle at top, #5b21b6, transparent 35%),
                linear-gradient(to bottom, #180025, #08000d);
            color: #f5e9ff;
            font-family: Georgia, serif;
        }

        .page {
            width: 85%;
            max-width: 850px;
            margin: auto;
            padding: 80px 0;
        }

        /* TITLE */

        .title {
            text-align: center;
            margin-bottom: 100px;
        }

        .title h1 {
            font-size: 55px;
            color: #ffffff;
            text-shadow:
                0 0 10px #c084fc,
                0 0 25px #9333ea,
                0 0 45px #7e22ce;
        }

        .title p {
            font-size: 18px;
            color: #d8b4fe;
        }

        /* LETTER */

        .letter {
            font-size: 21px;
            line-height: 2;
            text-align: justify;
            margin-bottom: 80px;
            text-shadow: 0 0 5px rgba(216, 180, 254, 0.2);
        }

        /* PICTURES */

        .photo {
            display: block;
            width: 75%;
            max-width: 550px;
            margin: 80px auto;
            border-radius: 20px;

            border: 3px solid rgba(216, 180, 254, 0.5);

            box-shadow:
                0 0 15px rgba(168, 85, 247, 0.5),
                0 0 40px rgba(126, 34, 206, 0.3);

            transition: 0.4s;
        }

        .photo:hover {
            transform: scale(1.03);

            box-shadow:
                0 0 25px #c084fc,
                0 0 60px #7e22ce;
        }

        /* SMALL CAPTIONS */

        .caption {
            text-align: center;
            color: #d8b4fe;
            font-size: 16px;
            margin-top: -60px;
            margin-bottom: 80px;
            font-style: italic;
        }

        /* FINAL SECTION */

        .ending {
            text-align: center;
            margin-top: 150px;
            padding-bottom: 150px;
        }

        .ending h2 {
            font-size: 40px;
            color: #ffffff;
            text-shadow: 0 0 20px #a855f7;
        }

        .ending p {
            font-size: 20px;
            line-height: 2;
            color: #e9d5ff;
        }

        /* LINK */

        .birthday-link {
            display: inline-block;
            margin-top: 40px;
            padding: 15px 30px;

            color: white;
            text-decoration: none;

            background: linear-gradient(
                135deg,
                #9333ea,
                #c026d3
            );

            border-radius: 30px;

            box-shadow:
                0 0 15px #a855f7,
                0 0 35px rgba(168, 85, 247, 0.5);

            transition: 0.3s;
        }

        .birthday-link:hover {
            transform: scale(1.08);

            box-shadow:
                0 0 25px #d8b4fe,
                0 0 60px #9333ea;
        }

        /* HEARTS */

        .heart {
            position: fixed;
            color: #c084fc;
            opacity: 0.3;
            pointer-events: none;
        }

        .heart1 {
            top: 15%;
            left: 8%;
            font-size: 25px;
        }

        .heart2 {
            top: 50%;
            right: 8%;
            font-size: 20px;
        }

        .heart3 {
            bottom: 15%;
            left: 12%;
            font-size: 30px;
        }

    </style>

</head>

<body>

    <div class="heart heart1">Love</div>
    <div class="heart heart2">Love</div>
    <div class="heart heart3">Love</div>


    <div class="page">

        <!-- TOP -->

        <section class="title">

            <h1>P </h1>
 <center> <img src="Image.png" height= 350 width= 500></center>
            <p>
                P
            </p>

        </section>


        <!-- LETTER -->

        <p class="letter">

            P
            <br><br>
            P
        </p>


        <!-- PHOTO 1 -->

        <img src="Image.png" class="photo">

        <p class="caption">
            P
            P
        </p> 


        <!-- MORE LETTER -->

        <p class="letter">

                P   
                P
            <br><br>
            P
            P   
        </p>


        <!-- PHOTO 2 -->

        <img src="Image.png" class="photo">

        <p class="caption">
            P
        </p>


        <!-- MORE LETTER -->

        <p class="letter">

            P
            <br><br>

            P
        </p>


        <!-- PHOTO 3 -->

        <img src="Image.jpg" class="photo">

        <p class="caption">
            P
        </p>


        <!-- FINAL LETTER -->

        <p class="letter">

            P

            <br><br>

            Happy birthday.

            <br><br>

                P
            <br><br>

            P

        </p>


        <!-- END -->

        <section class="ending">

            <h2>P </h2>

            <p>
                P

                P

        </section>

    </div>

</body>

</html>
